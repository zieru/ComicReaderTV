<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Reader Catalog Manager</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #4CAF50; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
    input, textarea, button { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 8px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
    button { background: #4CAF50; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #45a049; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .comic-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; border: 1px solid #333; position: relative; }
    .comic-card img { width: 100%; height: 260px; object-fit: cover; background: #333; }
    .comic-info { padding: 12px; }
    .comic-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
    .comic-sub { font-size: 12px; color: #888; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 4px; background: #333; color: #4CAF50; margin-top: 6px; }
    .btn-delete { background: #f44336; padding: 6px; font-size: 12px; margin-top: 8px; width: auto; float: right; }
  </style>
</head>
<body>
<div class="container">
  <h1>📚 Comic Catalog Manager</h1>
  <p>Input link Google Drive PDF (View / Embed / Preview) atau link PDF langsung untuk Android TV.</p>

  <div class="card">
    <h3>Tambah Komik Baru</h3>
    <form id="addForm">
      <label>Judul Komik / Manga:</label>
      <input type="text" id="title" placeholder="Contoh: One Piece Chapter 1" required>

      <label>URL Sampul (Cover Image):</label>
      <input type="url" id="cover" placeholder="https://example.com/cover.jpg (Opsional)">

      <label>Link Google Drive (Embed/View/Preview) atau Direct PDF:</label>
      <input type="url" id="source" placeholder="https://drive.google.com/file/d/1xxxx/preview" required>

      <label>Deskripsi:</label>
      <textarea id="desc" rows="2" placeholder="Deskripsi singkat..."></textarea>

      <button type="submit">➕ Simpan ke Katalog</button>
    </form>
  </div>

  <h2>Daftar Komik di Katalog</h2>
  <div id="comicGrid" class="grid">
    <p>Memuat katalog...</p>
  </div>
</div>

<script>
  const form = document.getElementById('addForm');
  const grid = document.getElementById('comicGrid');

  async function loadComics() {
    try {
      const res = await fetch('/api/comics');
      const data = await res.json();
      grid.innerHTML = '';
      if (data.length === 0) {
        grid.innerHTML = '<p>Belum ada komik. Silakan tambahkan lewat form di atas!</p>';
        return;
      }
      data.forEach(c => {
        const card = document.createElement('div');
        card.className = 'comic-card';
        card.innerHTML = `
          <img src="${c.cover_url || '/api/comics/' + c.id + '/page/1'}" onerror="this.src='https://via.placeholder.com/200x280?text=No+Cover'" alt="${c.title}">
          <div class="comic-info">
            <div class="comic-title">${c.title}</div>
            <div class="comic-sub">${c.total_pages ? c.total_pages + ' Halaman' : 'Processing...'}</div>
            <span class="badge">${c.source_type}</span>
            <button class="btn-delete" onclick="deleteComic('${c.id}')">Hapus</button>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch(err) {
      grid.innerHTML = '<p>Gagal memuat katalog: ' + err + '</p>';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      title: document.getElementById('title').value,
      cover_url: document.getElementById('cover').value,
      source_url: document.getElementById('source').value,
      description: document.getElementById('desc').value,
    };

    const res = await fetch('/api/comics', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      form.reset();
      loadComics();
    } else {
      alert('Gagal menambah komik!');
    }
  });

  async function deleteComic(id) {
    if (!confirm('Yakin ingin menghapus komik ini?')) return;
    await fetch('/api/comics/' + id, { method: 'DELETE' });
    loadComics();
  }

  loadComics();
</script>
</body>
</html>
