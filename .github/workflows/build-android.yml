name: Build Android TV APK & Server Deb

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android TV APK
    # Trigger jika manual, tag release v*, atau commit message mengandung keyword:
    # - Conventional commits: 'feat', 'fix', 'build', 'chore', 'release'
    # - Atau tag khusus: '[build]'
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, 'feat') ||
      contains(github.event.head_commit.message, 'fix') ||
      contains(github.event.head_commit.message, 'build') ||
      contains(github.event.head_commit.message, 'chore') ||
      contains(github.event.head_commit.message, 'release') ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          # Accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install NDK, build-tools, and platform
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "build-tools;33.0.2" "platforms;android-33"

      - name: Install Gio Tools (gogio)
        run: |
          go install gioui.org/cmd/gogio@latest

      - name: Build Android TV APK
        run: |
          # Kompilasi aplikasi client menjadi file APK Android
          gogio -target android -version 1.0.0.1 -minsdk 21 -targetsdk 33 -appid com.comicreader.tv -o comic_reader_tv.apk ./client/cmd/tv

      - name: Sign APK (Jika ada keystore secret)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" comic_reader_tv.apk "$KEY_ALIAS"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: comic-reader-tv-apk
          path: comic_reader_tv.apk

  build-server-deb:
    name: Build Server Deb (Linux x64)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, 'feat') ||
      contains(github.event.head_commit.message, 'fix') ||
      contains(github.event.head_commit.message, 'build') ||
      contains(github.event.head_commit.message, 'chore') ||
      contains(github.event.head_commit.message, 'release') ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Server Linux x64
        run: |
          mkdir -p server/build/package/usr/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server/build/package/usr/bin/comic-reader-server ./server/cmd/server
          chmod +x server/build/package/usr/bin/comic-reader-server

      - name: Package .deb
        run: |
          mkdir -p server/build/package/var/lib/comic-reader
          dpkg-deb --build --root-owner-group server/build/package comic-reader-server_1.0.0_amd64.deb

      - name: Upload Server Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: comic-reader-server-deb
          path: comic-reader-server_1.0.0_amd64.deb

  release:
    name: Publish GitHub Release
    needs: [build-android, build-server-deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: comic-reader-tv-apk

      - name: Download Deb Artifact
        uses: actions/download-artifact@v4
        with:
          name: comic-reader-server-deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            comic_reader_tv.apk
            comic-reader-server_1.0.0_amd64.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
