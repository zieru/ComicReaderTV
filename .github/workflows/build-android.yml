name: Build Android TV APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;25.2.9519653" "build-tools;33.0.2" "platforms;android-33"

      - name: Install Gio Tools (gogio)
        run: |
          go install gioui.org/cmd/gogio@latest

      - name: Build Android TV APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          # Kompilasi aplikasi client menjadi file APK Android
          gogio -target android -appversion 1.0.0 -appid com.comicreader.tv -o comic_reader_tv.apk ./client/cmd/tv

      - name: Sign APK (Jika ada keystore secret)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" comic_reader_tv.apk "$KEY_ALIAS"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: comic-reader-tv-apk
          path: comic_reader_tv.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: comic_reader_tv.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
